<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Birding Life List</title>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

:root{
    --forest:#245742;
    --forest-light:#7FB77E;
    --paper:#F7F4EA;
    --card:#FFFFFF;
    --text:#2F4F3E;
    --sub:#7A887A;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
        Inter,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(127,183,126,.15),
            transparent 40%
        ),
        var(--paper);

    color:var(--text);
}

.container{

    max-width:1400px;

    margin:auto;

    padding:30px;
}

/* Hero */

.hero{

    text-align:center;

    margin-bottom:30px;
}

.hero-icon{

    font-size:56px;

    margin-bottom:10px;
}

.hero h1{

    margin:0;

    color:var(--forest);

    font-size:40px;

    font-weight:700;

    letter-spacing:1px;
}

.hero p{

    margin-top:12px;

    color:var(--sub);

    font-size:16px;
}

/* Upload */

.upload-panel{

    background:white;

    border-radius:20px;

    padding:22px 24px;

    margin-bottom:24px;

    display:flex;

    flex-wrap:wrap;

    gap:15px;

    align-items:center;

    border:1px solid #E7E9DF;

    box-shadow:
        0 8px 30px rgba(0,0,0,.05);
}

input[type=file]{

    padding:10px;

    border-radius:10px;

    border:1px solid #DDE3D4;

    background:#F8FBF7;
}

#fileName{

    color:var(--sub);
}

/* Placeholder */

#chartPlaceholder{

    height:180px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:white;

    border-radius:20px;

    color:var(--sub);

    box-shadow:
        0 4px 20px rgba(0,0,0,.05);
}

/* Chart */

#chart{

    width:100%;

    height:820px;

    display:none;

    background:#FBFAF5;

    border-radius:24px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.06);
}

@media(max-width:768px){

    .container{
        padding:15px;
    }

    .hero h1{
        font-size:30px;
    }

    #chart{
        height:600px;
    }
}

#exportBtn{

    background:var(--forest);

    color:white;

    border:none;

    border-radius:12px;

    padding:12px 18px;

    cursor:pointer;

    font-size:14px;

    font-weight:600;
}

#exportBtn:disabled{

    opacity:.5;

    cursor:not-allowed;
}

</style>
</head>

<body>

<div class="container">

<div class="hero">

<div class="hero-icon">
🦉
</div>

<h1>
Birding Life List
</h1>

<p>
每一次新发现，都让生命清单增长一点点
</p>

</div>

<div class="upload-panel">

<input
    type="file"
    id="csvFile"
    accept=".csv"
/>

<span id="fileName">
请选择 eBird 导出的 CSV 文件
</span>

<button id="exportBtn" disabled>
    导出 PNG
</button>

</div>

<div id="chartPlaceholder">
上传 CSV 后生成 Life List 成长曲线
</div>

<div id="chart"></div>

</div>

<script>

let chart = null;
let currentChartData = [];

document
.getElementById("csvFile")
.addEventListener(
    "change",
    handleFile
);

document
.getElementById("exportBtn")
.addEventListener(
    "click",
    exportPNG
);

function handleFile(event){

    const file =
        event.target.files[0];

    if(!file) return;

    document
        .getElementById("fileName")
        .innerText =
        file.name;

    Papa.parse(file,{

        header:true,

        skipEmptyLines:true,

        complete:(result)=>{

            processData(
                result.data
            );

        },

        error:(err)=>{

            console.error(err);

            alert("CSV解析失败");
        }

    });

}

function processData(rows){

    rows = rows.filter(
        row => Number(row.Countable) !== 0
    );

    const firstSeen = {};

    rows.forEach(row=>{

        const species =
            row["Common Name"] ||
            row["Scientific Name"];

        const date =
            parseDate(row["Date"]);

        if(!species || !date) return;

        if(
            !firstSeen[species] ||
            date < firstSeen[species]
        ){
            firstSeen[species] = date;
        }

    });

    const speciesRecords =
        Object.entries(firstSeen)
        .map(([species,date])=>({
            species,
            date
        }))
        .sort((a,b)=>a.date-b.date);

    let cumulative = 0;

    const dateMap = {};

    speciesRecords.forEach(item=>{

        const date =
            formatDate(item.date);

        cumulative++;

        if(!dateMap[date]){

            dateMap[date] = {

                date,

                count:cumulative,

                species:[]
            };

        }else{

            dateMap[date].count =
                cumulative;
        }

        dateMap[date]
            .species
            .push(item.species);

    });

    const chartData =
        Object.values(dateMap);

    renderChart(chartData);
}

function renderChart(data){

    currentChartData = data;

    document
        .getElementById("exportBtn")
        .disabled = false;

    document
        .getElementById("chartPlaceholder")
        .style.display = "none";

    document
        .getElementById("chart")
        .style.display = "block";

    if(chart){
        chart.dispose();
    }

    chart = echarts.init(
        document.getElementById("chart")
    );

    chart.setOption({

        backgroundColor:"#FBFAF5",

        animationDuration:1800,

        title:{
            text:"Life List Journey",

            left:"center",

            top:20,

            textStyle:{
                color:"#245742",
                fontSize:24,
                fontWeight:"600"
            }
        },

        tooltip:{

            trigger:"axis",

            axisPointer:{
                type:"cross"
            },

            formatter:function(params){

                const p = params[0];

                const speciesHtml =
                    p.data.species
                    .map(
                        s => `• ${s}`
                    )
                    .join("<br>");

                return `

                <div style="
                    max-width:340px;
                    line-height:1.7;
                ">

                    <div style="
                        font-weight:700;
                        color:#245742;
                        font-size:15px;
                        margin-bottom:6px;
                    ">
                        ${p.data.date}
                    </div>

                    <div>
                        Life List：
                        <b>${p.data.count}</b>
                    </div>

                    <hr style="
                        border:none;
                        border-top:1px solid #E5E5E5;
                        margin:8px 0;
                    ">

                    <div style="
                        color:#687A67;
                        margin-bottom:5px;
                    ">
                        New Species
                    </div>

                    ${speciesHtml}

                </div>
                `;
            }
        },

        grid:{
            left:70,
            right:40,
            top:90,
            bottom:70
        },

        xAxis:{

            type:"time",

            axisLine:{
                lineStyle:{
                    color:"#809671"
                }
            },

            axisLabel:{
                color:"#687A67"
            }
        },

        yAxis:{

            type:"value",

            name:"Species",

            nameTextStyle:{
                color:"#687A67"
            },

            axisLabel:{
                color:"#687A67"
            },

            splitLine:{
                lineStyle:{
                    type:"dashed",
                    color:"#D9DFD2"
                }
            }
        },

        series:[{

            type:"line",

            smooth:0.25,

            symbol:"circle",

            symbolSize:5,

            data:data.map(d=>({

                value:[
                    d.date,
                    d.count
                ],

                date:d.date,

                count:d.count,

                species:d.species

            })),

            lineStyle:{
                width:4,
                color:"#245742"
            },

            itemStyle:{
                color:"#245742"
            },

            areaStyle:{

                opacity:1,

                color:{
                    type:"linear",

                    x:0,
                    y:0,
                    x2:0,
                    y2:1,

                    colorStops:[

                        {
                            offset:0,
                            color:"rgba(36,87,66,0.35)"
                        },

                        {
                            offset:0.7,
                            color:"rgba(127,183,126,0.10)"
                        },

                        {
                            offset:1,
                            color:"rgba(127,183,126,0.01)"
                        }

                    ]
                }
            }
        }]
    });

}

function parseDate(str){

    if(!str) return null;

    const d = new Date(str);

    if(isNaN(d)) return null;

    return d;
}

function formatDate(date){

    return date
        .toISOString()
        .slice(0,10);
}

window.addEventListener(
    "resize",
    ()=>{
        if(chart){
            chart.resize();
        }
    }
);

function exportPNG(){

    if(!currentChartData.length) return;

    const totalSpecies =
        currentChartData[
            currentChartData.length - 1
        ].count;

    const container =
        document.createElement("div");

    container.style.width = "1920px";
    container.style.height = "1080px";
    container.style.position = "fixed";
    container.style.left = "-99999px";

    document.body.appendChild(container);

    const exportChart =
        echarts.init(
            container,
            null,
            {
                renderer:"canvas",
                width:1920,
                height:1080
            }
        );

    exportChart.setOption({

        backgroundColor:"#FBFAF5",

        animation:false,

        graphic:[

            {
                type:"text",

                right:60,

                bottom:40,

                style:{

                    text:
                        `Total Species: ${totalSpecies}`,

                    fill:"#245742",

                    font:
                        "bold 34px Inter"
                }
            }
        ],

        tooltip:{},

        grid:{
            left:120,
            right:80,
            top:80,
            bottom:120
        },

        xAxis:{

            type:"time",

            axisLine:{
                lineStyle:{
                    color:"#809671"
                }
            },

            axisLabel:{
                color:"#687A67",
                fontSize:18
            }
        },

        yAxis:{

            type:"value",

            name:"Species",

            nameTextStyle:{
                color:"#687A67",
                fontSize:20
            },

            axisLabel:{
                color:"#687A67",
                fontSize:18
            },

            splitLine:{
                lineStyle:{
                    type:"dashed",
                    color:"#D9DFD2"
                }
            }
        },

        series:[{

            type:"line",

            smooth:0.25,

            symbol:"circle",

            symbolSize:8,

            data:currentChartData.map(d=>({

                value:[
                    d.date,
                    d.count
                ]
            })),

            lineStyle:{
                width:6,
                color:"#245742"
            },

            itemStyle:{
                color:"#245742"
            },

            areaStyle:{

                opacity:1,

                color:{
                    type:"linear",

                    x:0,
                    y:0,
                    x2:0,
                    y2:1,

                    colorStops:[

                        {
                            offset:0,
                            color:"rgba(36,87,66,0.35)"
                        },

                        {
                            offset:0.7,
                            color:"rgba(127,183,126,0.10)"
                        },

                        {
                            offset:1,
                            color:"rgba(127,183,126,0.01)"
                        }
                    ]
                }
            }
        }]
    });

    const url =
        exportChart.getDataURL({

            type:"png",

            pixelRatio:1,

            backgroundColor:"#FBFAF5"
        });

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "Birding-Life-List-1920x1080.png";

    link.click();

    exportChart.dispose();

    document.body.removeChild(
        container
    );
}

</script>

</body>
</html>
